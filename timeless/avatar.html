<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0,  user-scalable=no" />
        <meta name="description" content="The Timeless Adventure is a web-type adventure game 
                where you can explore the world and interact with the environment!" />
        <meta property="og:image" content="assets/Timeless_Adventure_logo.png" />
        <title>Avatar Selection | The Timeless Adventure</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="styles/avatar.css">
        <link rel="icon" type="image/x-icon" href="assets/Timeless_Adventure_logo.png">
    </head>
    <body class="overflow-hidden h-screen min-h-screen w-screen flex flex-col items-center 
                avatar-pg text-white bg-blue-200 backdrop-saturate-100">
        <!-- cloud on top of the avatar screen -->
        <img src="assets/backgrounds/cloud.png" alt="Cloud" class="cloud">
        <!-- logo -->
        <div class="flex flex-col items-center text-center p-6 w-full max-w-lg">
            <img src="assets/Timeless_Adventure_logo.png" alt="Timeless Adventure Logo" class="logo">
        </div>
        
        <!-- avatar selection -->
        <div class="flex flex-col items-center text-center p-6 w-full max-w-lg">
            <div class="flex justify-center items-center gap-6">
                <div id="prevAvatar" class="cursor-pointer">
                    <img src="assets/util/Prev.png" alt="Previous" class="arrow">
                </div>
                <div id="avatar" class="flex flex-col">
                    <img id="avatarImage" src="assets/characters/KEVIN.png" alt="Avatar" class="avatar-selection">
                </div>
                <div id="nextAvatar" class="cursor-pointer">
                    <img src="assets/util/Next.png" alt="Next" class="arrow">
                </div>
            </div>
        </div>
        <div class="my-auto w-full px-4 text-center">
            <div id="greeting"></div>
            <div class="text-center mt-6">
                <input id="username" class="name-box text-center w-60" type="text" 
                    autocomplete="off" placeholder="Enter your name here...">
            </div>
            <div class="text-center mt-4">
                <button id="submitBtn" class="button w-auto" type="button">Enter the game</button>
            </div>
        </div>
        <script src="avatar.js"></script>
    </body>
</html>
