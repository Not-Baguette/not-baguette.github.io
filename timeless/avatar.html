<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0,  user-scalable=no" />
        <meta name="description" content="The Timeless Adventure is a web-type adventure game 
                where you can explore the world and interact with the environment!" />
        <meta property="og:image" content="assets/Timeless_Adventure_logo.png" />
        <title>Main Menu | The Timeless Adventure</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="styles/avatar.css">
        <link rel="icon" type="image/x-icon" href="assets/Timeless_Adventure_logo.png">
    </head>
    <body class="overflow-hidden h-screen min-h-screen w-screen flex items-center justify-center 
                avatar-pg main-menu text-white bg-blue-200 backdrop-saturate-100">
        <!-- cloud on top of the main menu screen -->
        <img src="assets/backgrounds/cloud.png" alt="Cloud" class="cloud">
        
        <!-- main content -->
        <div class="flex items-center justify-center w-full h-full">
            <!-- character image -->
            <div class="flex flex-col justify-start character-container m-auto">
                <img src="assets/characters/KEVIN.png" alt="Character" class="character" id="avatarImage">
                <input class="name-box text-center" type="text" id="avatarName" 
                placeholder="Enter your name here..." maxlength="20" autocomplete="off">
            </div>
            
            <!-- main menu -->
            <div class="flex flex-col items-center text-center p-6 w-full max-w-lg">
                <img src="assets/Timeless_Adventure_logo.png" alt="Timeless Adventure Logo" class="logo">
                <button class="menu-option cursor-pointer" id="startGame">Start Game</button>
                <button class="menu-option cursor-pointer" id="avatarSelection">Select Avatar</button>
                <button class="menu-option cursor-pointer" id="avatarLore">Character's Story</button>
                <button class="menu-option cursor-pointer" id="credits">Credits</button>
            </div>
        </div>

        <!-- Avatar selection modal -->
        <div id="avatarSelectionModal" class="modal hidden">
            <div class="modal-content avatar-selection-content mx-4">
                <span class="close" id="closeAvatarSelectionModal">&times;</span>
                <div class="avatar-selection-container flex flex-col">
                    <div class="avatars flex flex-row justify-center">
                        <img alt="leftAvatar" class="avatar-selection" id="leftAvatar">
                        <img alt="currentAvatar" class="avatar-selection" id="currentAvatar">
                        <img alt="rightAvatar" class="avatar-selection" id="rightAvatar">
                    </div>
                    <div class="avatar-selection-buttons flex flex-row justify-between mt-4">
                        <img src="assets/util/prev.png" alt="Previous" class="arrow" id="prevAvatar">
                        <button class="confirm-button cursor-pointer" id="confirmAvatar">Confirm</button>
                        <img src="assets/util/next.png" alt="Next" class="arrow" id="nextAvatar">
                    </div>
                </div>
            </div>
        </div>

        <!-- Character story modal -->
        <div id="characterStoryModal" class="modal hidden">
            <div class="modal-content story-modal-content mx-4">
                <span class="close" id="closeStoryModal">&times;</span>
                <h2 class="mb-4">Character's Story</h2>
                <p>Here is the detailed story of the character...</p>
            </div>
        </div>
        <div id="creditsModal" class="modal hidden">
            <div class="modal-content story-modal-content mx-4">
                <span class="close" id="closeCreditsModal">&times;</span>
                <h2 class="mb-4 text-2xl font-bold">Credits</h2>
                <div class="credit-container">
                    <p class="mb-3">Made with love by;</p>
                    <ul class="pl-6 mb-4">
                        <li></li>
                    </ul>
                    <p>Special thanks to everyone who supported this project!</p>
                </div>
            </div>
        </div>
        <!-- additional scripts -->
        <script src="avatar.js"></script>
    </body>
</html>
