# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build
      run: npm run build
      env:
        VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
        VITE_SPOTIFY_CLIENT_SECRET: ${{ secrets.VITE_SPOTIFY_CLIENT_SECRET }}
        VITE_SPOTIFY_REFRESH_TOKEN: ${{ secrets.VITE_SPOTIFY_REFRESH_TOKEN }}
        VITE_STEAM_API: ${{ secrets.VITE_STEAM_API }}
        
    - name: Add .nojekyll file and fix MIME types
      run: |
        # Add .nojekyll to prevent Jekyll processing
        touch dist/.nojekyll
        
        # Create a web.config for IIS-style MIME type handling (GitHub Pages may use this)
        cat > dist/web.config << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <system.webServer>
            <staticContent>
              <mimeMap fileExtension=".js" mimeType="application/javascript" />
              <mimeMap fileExtension=".mjs" mimeType="application/javascript" />
              <mimeMap fileExtension=".woff" mimeType="font/woff" />
              <mimeMap fileExtension=".woff2" mimeType="font/woff2" />
            </staticContent>
            <httpErrors errorMode="Custom" defaultResponseMode="File">
              <remove statusCode="404" subStatusCode="-1" />
              <error statusCode="404" path="index.html" responseMode="ExecuteURL" />
            </httpErrors>
          </system.webServer>
        </configuration>
        EOF
        
        # Create .htaccess for Apache-style servers
        cat > dist/.htaccess << 'EOF'
        # MIME type fixes
        AddType application/javascript .js
        AddType application/javascript .mjs
        AddType font/woff .woff
        AddType font/woff2 .woff2
        
        # Enable compression
        <IfModule mod_deflate.c>
          AddOutputFilterByType DEFLATE text/plain
          AddOutputFilterByType DEFLATE text/html
          AddOutputFilterByType DEFLATE text/xml
          AddOutputFilterByType DEFLATE text/css
          AddOutputFilterByType DEFLATE application/xml
          AddOutputFilterByType DEFLATE application/xhtml+xml
          AddOutputFilterByType DEFLATE application/rss+xml
          AddOutputFilterByType DEFLATE application/javascript
          AddOutputFilterByType DEFLATE application/x-javascript
        </IfModule>
        
        # Handle client-side routing
        <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
        </IfModule>
        EOF
        
        # List all built files to verify structure
        echo "Build output verification:"
        find dist -type f -name "*.js" -o -name "*.css" -o -name "*.html" | head -20
        
        # Check if index.html has been transformed properly
        echo "Checking index.html transformation:"
        cat dist/index.html | grep -E "(script|link)" | head -5
        
        # Force .js extension on all JavaScript files (in case any don't have it)
        find dist -type f -name "*.mjs" -exec bash -c 'mv "$1" "${1%.mjs}.js"' _ {} \;
        
        # Verify .nojekyll exists
        ls -la dist/ | grep nojekyll
        
        # Create a simple HTTP server test file to verify MIME types locally
        cat > dist/mime-test.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head><title>MIME Test</title></head>
        <body>
        <script>
        console.log('If you see this, JavaScript is working');
        fetch(window.location.href.replace('mime-test.html', '') + 'assets/')
          .then(r => console.log('Assets accessible'))
          .catch(e => console.log('Assets issue:', e));
        </script>
        </body>
        </html>
        EOF
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4