<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>avatar</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="assets/Timeless_Adventure_logo.png">
    </head>
    <body class="flex flex-col items-center bg-gray-900 text-white min-h-screen">
        <!-- avatar selection -->
        <div class="my-auto w-full px-4">
            <div class="flex flex-col sm:flex-row items-center justify-center">
                <div id="prevAvatar" class="cursor-pointer mt-12 sm:mt-0 sm:mr-4">
                    <img src="assets/prev.png" alt="Previous" class="arrow">
                </div>
                <div id="avatar" class="flex flex-col w-96 lg:w-full">
                    <img id="avatarImage" src="assets/GreenKnight.png" alt="Avatar" class="avatar-selection">
                </div>
                <div id="nextAvatar" class="cursor-pointer mt-12 sm:mt-0 sm:ml-4">
                    <img src="assets/Next.png" alt="Next" class="arrow">
                </div>
            </div>
            <div class="text-center mt-6">
                <input id="username" class="name-box text-center w-full sm:w-auto" type="text" placeholder="Enter your name here...">
            </div>
            <div class="text-center mt-4">
                <button id="submitBtn" class="button w-full sm:w-auto" type="button">Enter the game</button>
            </div>
        </div>
        <script src="avatar.js"></script>
    </body>
</html>
